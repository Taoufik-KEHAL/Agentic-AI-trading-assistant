version: "3.9"

services:
  app:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: bash -c "pip install -r requirements.txt && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.example
